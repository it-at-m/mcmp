version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/mcmp-backend"
      - "/mcmp-eai-infoblox"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      maven-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directories:
      - "/mcmp-callback-server"
      - "/mcmp-eai-awx"
      - "/mcmp-eai-baas"
      - "/mcmp-eai-checkmk"
      - "/mcmp-eai-common"
      - "/mcmp-eai-foreman"
      - "/mcmp-eai-netapp-ontap"
      - "/mcmp-eai-netapp-storagegrid"
      - "/mcmp-eai-olvm"
      - "/mcmp-eai-patchnight"
      - "/mcmp-eai-rightsizing"
      - "/mcmp-eai-scheduler"
      - "/mcmp-eai-snow"
      - "/mcmp-eai-ucs"
      - "/mcmp-eai-vcenter"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/mcmp-frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"